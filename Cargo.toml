[package]
name = "metal-git"
version = "0.5.0"
authors = ["Yoichi Imai <sunnyone41@gmail.com>"]
edition = "2021"
description = "GUI Git frontend written in Rust with GTK 4"
license = "MIT"
repository = "https://github.com/sunnyone/metal-git"

[lib]
name = "metal_git"

[dependencies]
git2 = { version = "0.21", features = ["cred", "https", "ssh"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
chrono = "*"
futures = "0.3"
url = "2"
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[dev-dependencies]
tempdir = "0.3"

[build-dependencies]
glib-build-tools = "0.22"

[package.metadata.deb]
section = "vcs"
depends = "$auto, librsvg2-common"
extended-description = """\
Metal Git is a GUI Git frontend written in Rust with gtk4-rs and git2-rs. \
It opens the Git repository in the current working directory."""
assets = [
    ["target/release/metal-git", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/metal-git/", "644"],
]
