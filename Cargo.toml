[package]
name = "metal-git"
version = "0.0.1"
authors = ["Yoichi Imai <sunnyone41@gmail.com>"]
edition = "2021"

[lib]
name = "metal_git"

[dependencies]
git2 = { version = "0.21", features = ["cred", "https", "ssh"] }
gtk = { package = "gtk4", version = "0.11" }
chrono = "*"
futures = "0.3"
url = "2"

[dev-dependencies]
tempdir = "0.3"
